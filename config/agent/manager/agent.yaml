apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: diskfleet-agent
  namespace: diskfleet-system
spec:
  selector:
    matchLabels: {app: diskfleet-agent}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  template:
    metadata:
      labels: {app: diskfleet-agent}
    spec:
      serviceAccountName: diskfleet-agent
      hostPID: true
      nodeSelector:
        storage.diskfleet.io/enabled: 'true'
      terminationGracePeriodSeconds: 60
      containers:
        - name: agent
          image: diskfleet-agent:dev
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/diskfleet-agent]
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - {name: ENABLE_DISK_WRITES, value: 'false'}
            - {name: STATE_DIR, value: /var/lib/diskfleet}
            - {name: RECONCILE_INTERVAL, value: '30'}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
          volumeMounts:
            - {name: dev, mountPath: /dev}
            - {name: sys, mountPath: /sys, readOnly: true}
            # lsblk reads serial/WWN and filesystem metadata from the host udev DB.
            - {name: udev, mountPath: /run/udev, readOnly: true}
            - {name: lvm-run, mountPath: /run/lvm}
            # LVM advisory locks must be shared with host LVM/CSI processes.
            # Default global/locking_dir is /run/lock/lvm, not /run/lvm.
            - {name: lvm-lock, mountPath: /run/lock/lvm}
            - {name: lvm-config, mountPath: /etc/lvm}
            - {name: state, mountPath: /var/lib/diskfleet}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: dev
          hostPath: {path: /dev, type: Directory}
        - name: sys
          hostPath: {path: /sys, type: Directory}
        - name: udev
          hostPath: {path: /run/udev, type: Directory}
        - name: lvm-run
          hostPath: {path: /run/lvm, type: DirectoryOrCreate}
        - name: lvm-lock
          hostPath: {path: /run/lock/lvm, type: DirectoryOrCreate}
        - name: lvm-config
          hostPath: {path: /etc/lvm, type: DirectoryOrCreate}
        - name: state
          hostPath: {path: /var/lib/diskfleet, type: DirectoryOrCreate}
        - name: tmp
          emptyDir: {}
