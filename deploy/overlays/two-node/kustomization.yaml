apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Nodes receive this label only after scripts/deploy/two-node.sh verifies their
# InternalIPs and Ready conditions. Existing control-plane taints are retained.
resources:
  - ../../bundles/all
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          pulsar.songof.dev/two-node: "true"
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: diskfleet-agent
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector/pulsar.songof.dev~1two-node
        value: "true"
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule
