apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: diskpools.storage.diskfleet.io
spec:
  group: storage.diskfleet.io
  scope: Cluster
  names:
    plural: diskpools
    singular: diskpool
    kind: DiskPool
    shortNames: [dpool]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Node, type: string, jsonPath: .spec.nodeName}
        - {name: State, type: string, jsonPath: .status.phase}
        - {name: VG, type: string, jsonPath: .spec.vgName}
        - {name: Available, type: integer, jsonPath: .status.availableBytes}
        - {name: StorageClass, type: string, jsonPath: .status.storageClass}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [nodeName, devices, vgName, approved]
              x-kubernetes-validations:
                - rule: self.nodeName == oldSelf.nodeName
                  message: nodeName is immutable.
                - rule: self.devices == oldSelf.devices
                  message: Device identities are immutable; create a separate pool for a new disk.
                - rule: self.vgName == oldSelf.vgName
                  message: vgName is immutable.
              properties:
                nodeName: {type: string, minLength: 1, maxLength: 253}
                vgName:
                  type: string
                  maxLength: 55
                  pattern: '^df_[a-z0-9][a-z0-9_-]{0,51}$'
                approved: {type: boolean, default: false}
                devices:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required: [path, serial, sizeBytes]
                    properties:
                      path:
                        type: string
                        maxLength: 512
                        pattern: '^/dev/disk/by-id/[A-Za-z0-9._:+-]+$'
                      serial: {type: string, minLength: 1, maxLength: 256}
                      sizeBytes: {type: integer, format: int64, minimum: 1073741824}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [PendingApproval, WritesDisabled, Ready, Error, Retained]
                capacityBytes: {type: integer, format: int64, minimum: 0}
                availableBytes: {type: integer, format: int64, minimum: 0}
                message: {type: string, maxLength: 2048}
                observedGeneration: {type: integer, format: int64}
                storageClass: {type: string, maxLength: 63}
                topologyHostname: {type: string, maxLength: 63}
