name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Go static checks
        run: go vet ./...
      - name: All modules
        run: make test
      - name: Render unified deployment
        run: kubectl kustomize deploy/all > /tmp/pulsar-operator.yaml
  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pulsar-operator:ci
      - uses: docker/build-push-action@v6
        with:
          context: modules/storage
          push: false
          tags: pulsar-operator-storage:ci
