apiVersion: v1
kind: Namespace
metadata:
  name: pulsar-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsar-operator
  namespace: pulsar-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulsar-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulsar-operator
subjects:
  - kind: ServiceAccount
    name: pulsar-operator
    namespace: pulsar-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar-operator
  namespace: pulsar-operator-system
  labels:
    app.kubernetes.io/name: pulsar-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsar-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsar-operator
    spec:
      serviceAccountName: pulsar-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/songof/pulsar-operator:latest
          imagePullPolicy: IfNotPresent
          args: ["--leader-elect"]
          env:
            # Set CONSOLE_TOKEN, for example from a Secret, to require a token for the console API.
            - name: CONSOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pulsar-operator-console
                  key: token
                  optional: true
          ports:
            - name: console
              containerPort: 8080
            - name: probes
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar-operator-console
  namespace: pulsar-operator-system
spec:
  selector:
    app.kubernetes.io/name: pulsar-operator
  ports:
    - name: console
      port: 8080
      targetPort: console
