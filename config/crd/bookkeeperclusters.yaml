apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bookkeeperclusters.pulsar.songof.dev
spec:
  group: pulsar.songof.dev
  scope: Namespaced
  names:
    plural: bookkeeperclusters
    singular: bookkeepercluster
    kind: BookKeeperCluster
    shortNames: [bkc]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [replicas, storage]
              properties:
                replicas: {type: integer, minimum: 0}
                image: {type: string}
                storage:
                  type: object
                  required: [journalPVC, ledgerPVC]
                  properties:
                    journalPVC:
                      type: object
                      required: [size]
                      properties:
                        storageClassName: {type: string}
                        size: {type: string}
                    ledgerPVC:
                      type: object
                      required: [size]
                      properties:
                        storageClassName: {type: string}
                        size: {type: string}
                ops:
                  type: object
                  properties:
                    decommissionBookie: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                observedGeneration: {type: integer}
                readyReplicas: {type: integer}
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
