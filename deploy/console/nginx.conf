worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Do not log query strings, Referer, Authorization or arbitrary headers.
    log_format console_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout console_safe;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    server {
        listen 8080;
        server_name _;
        # nginx request-error messages include raw URLs and Referer and cannot
        # use log_format. Keep startup diagnostics above; use sanitized access
        # statuses plus backend logs for request failures.
        error_log /dev/null;
        absolute_redirect off;
        client_max_body_size 1m;
        # Retired token links are redirected before reaching any upstream (and
        # before an upstream failure could include the original URL in errors).
        if ($arg_token != "") { return 303 $uri; }

        # Authentication remains in the two backends. In particular, nginx
        # forwards the original Authorization header without substituting tokens.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /storage {
            return 308 /storage/$is_args$args;
        }

        # Both API requests and static assets are relative to /storage/.
        # The trailing slash on proxy_pass removes the /storage/ prefix.
        location ^~ /storage/ {
            proxy_pass http://diskfleet-api.diskfleet-system.svc:8080/;
        }

        location /api/ {
            proxy_pass http://pulsar-operator-console.pulsar-operator-system.svc:8080;
        }

        location / {
            proxy_pass http://pulsar-operator-console.pulsar-operator-system.svc:8080;
        }
    }
}
