apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pulsarclusters.pulsar.songof.dev
spec:
  group: pulsar.songof.dev
  scope: Namespaced
  names:
    plural: pulsarclusters
    singular: pulsarcluster
    kind: PulsarCluster
    shortNames: [pc]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [brokers, bookies, storage]
              properties:
                brokers: {type: integer, minimum: 0}
                bookies: {type: integer, minimum: 0}
                image: {type: string}
                resources:
                  type: object
                  properties:
                    cpu: {type: string}
                    memory: {type: string}
                storage:
                  type: object
                  required: [journalPVC, ledgerPVC]
                  properties:
                    journalPVC:
                      type: object
                      required: [size]
                      properties:
                        storageClassName: {type: string}
                        size: {type: string}
                    ledgerPVC:
                      type: object
                      required: [size]
                      properties:
                        storageClassName: {type: string}
                        size: {type: string}
                ops:
                  type: object
                  properties:
                    restartBrokerOrdinal: {type: integer, minimum: 0}
                    decommissionBookie: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                observedGeneration: {type: integer}
                brokerReady: {type: integer}
                bookKeeperReady: {type: integer}
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Brokers
          type: integer
          jsonPath: .spec.brokers
        - name: Bookies
          type: integer
          jsonPath: .spec.bookies
        - name: Phase
          type: string
          jsonPath: .status.phase
