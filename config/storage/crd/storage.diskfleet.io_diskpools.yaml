apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: diskpools.storage.diskfleet.io
spec:
  group: storage.diskfleet.io
  scope: Cluster
  names:
    plural: diskpools
    singular: diskpool
    kind: DiskPool
    shortNames: [dpool]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Node, type: string, jsonPath: .spec.nodeName}
        - {name: State, type: string, jsonPath: .status.phase}
        - {name: VG, type: string, jsonPath: .spec.vgName}
        - {name: Available, type: integer, jsonPath: .status.availableBytes}
        - {name: StorageClass, type: string, jsonPath: .status.storageClass}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [nodeName, devices, vgName, approved]
              x-kubernetes-validations:
                - rule: self.nodeName == oldSelf.nodeName
                  message: nodeName is immutable.
                - rule: self.devices == oldSelf.devices
                  message: Device identities are immutable; create a separate pool for a new disk.
                - rule: self.vgName == oldSelf.vgName
                  message: vgName is immutable.
                - rule: >-
                    !has(oldSelf.allocationApproval) || oldSelf.allocationApproval.decision != 'Approved' ||
                    (has(self.allocationApproval) && self.allocationApproval == oldSelf.allocationApproval)
                  message: An Approved allocation decision cannot be changed or removed.
              properties:
                nodeName: {type: string, minLength: 1, maxLength: 253}
                vgName:
                  type: string
                  maxLength: 55
                  pattern: '^df_[a-z0-9][a-z0-9_-]{0,51}$'
                approved: {type: boolean, default: false}
                allocationApproval:
                  type: object
                  required: [poolUID, runID, resultDigest, decision, reviewedAt]
                  x-kubernetes-validations:
                    - rule: >-
                        self.decision != 'Rejected' || (has(self.note) && self.note.matches('[^[:space:]\\p{Z}\\x{0085}]'))
                      message: A rejected allocation decision requires a nonblank note.
                  properties:
                    poolUID: {type: string, minLength: 1, maxLength: 128}
                    runID: {type: string, minLength: 32, maxLength: 32, pattern: '^[0-9a-f]{32}$'}
                    resultDigest: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
                    decision: {type: string, enum: [Approved, Rejected]}
                    reviewedAt: {type: string, format: date-time, maxLength: 64}
                    note: {type: string, maxLength: 1024}
                devices:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required: [path, serial, sizeBytes]
                    properties:
                      path:
                        type: string
                        maxLength: 512
                        pattern: '^/dev/disk/by-id/[A-Za-z0-9._:+-]+$'
                      serial: {type: string, minLength: 1, maxLength: 256}
                      sizeBytes: {type: integer, format: int64, minimum: 1073741824}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [PendingApproval, WritesDisabled, Preparing, Benchmarking, AwaitingReview, Rejected, BenchmarkFailed, LegacyUnreviewed, Ready, Error, Retained]
                capacityBytes: {type: integer, format: int64, minimum: 0}
                availableBytes: {type: integer, format: int64, minimum: 0}
                message: {type: string, maxLength: 2048}
                observedGeneration: {type: integer, format: int64}
                storageClass: {type: string, maxLength: 63}
                topologyHostname: {type: string, maxLength: 63}
                benchmark:
                  type: object
                  required: [poolUID, nodeUID, vgName, device, runID, profile, phase, testSizeBytes, cleanupVerified]
                  properties:
                    poolUID: {type: string, minLength: 1, maxLength: 128}
                    nodeUID: {type: string, minLength: 1, maxLength: 128}
                    vgName:
                      type: string
                      maxLength: 55
                      pattern: '^df_[a-z0-9][a-z0-9_-]{0,51}$'
                    device:
                      type: object
                      required: [path, serial, sizeBytes]
                      properties:
                        path:
                          type: string
                          maxLength: 512
                          pattern: '^/dev/disk/by-id/[A-Za-z0-9._:+-]+$'
                        serial: {type: string, minLength: 1, maxLength: 256}
                        sizeBytes: {type: integer, format: int64, minimum: 1073741824}
                    runID: {type: string, minLength: 32, maxLength: 32, pattern: '^[0-9a-f]{32}$'}
                    profile: {type: string, enum: [temporary-lv-v1], maxLength: 32}
                    phase: {type: string, enum: [Running, Succeeded, Failed, Interrupted, Blocked]}
                    startedAt: {type: string, format: date-time, maxLength: 64}
                    completedAt: {type: string, format: date-time, maxLength: 64}
                    testSizeBytes: {type: integer, format: int64, enum: [1073741824]}
                    cleanupVerified: {type: boolean}
                    errorCode: {type: string, maxLength: 128}
                    message: {type: string, maxLength: 2048}
                    resultDigest: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
                    workloads:
                      type: array
                      maxItems: 4
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, blockSizeBytes, queueDepth, durationSeconds, bytes, bandwidthBytesPerSecond, iops, latencyMeanNs, latencyP95Ns, latencyP99Ns, errors]
                        properties:
                          name: {type: string, enum: [seq-write, seq-read, rand-write, rand-read], maxLength: 16}
                          blockSizeBytes: {type: integer, format: int64, enum: [4096, 1048576]}
                          queueDepth: {type: integer, format: int32, enum: [16]}
                          durationSeconds: {type: number, format: double, minimum: 0}
                          bytes: {type: integer, format: int64, minimum: 0}
                          bandwidthBytesPerSecond: {type: integer, format: int64, minimum: 0}
                          iops: {type: number, format: double, minimum: 0}
                          latencyMeanNs: {type: number, format: double, minimum: 0}
                          latencyP95Ns: {type: number, format: double, minimum: 0}
                          latencyP99Ns: {type: number, format: double, minimum: 0}
                          errors: {type: integer, format: int64, minimum: 0}
