# Adapted from Rancher local-path-provisioner v0.0.37; see source.json.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pulsar-system-lab-storage
  labels:
    app.kubernetes.io/name: pulsar-system-lab-provisioner
    app.kubernetes.io/part-of: pulsar-operator
    storage.pulsar.songof.dev/mode: system-directory-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsar-system-lab-provisioner
  namespace: pulsar-system-lab-storage
  labels:
    app.kubernetes.io/name: pulsar-system-lab-provisioner
    app.kubernetes.io/part-of: pulsar-operator
    storage.pulsar.songof.dev/mode: system-directory-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulsar-system-lab-provisioner
  namespace: pulsar-system-lab-storage
  labels:
    app.kubernetes.io/name: pulsar-system-lab-provisioner
    app.kubernetes.io/part-of: pulsar-operator
    storage.pulsar.songof.dev/mode: system-directory-lab
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pulsar-system-lab-provisioner
  labels:
    app.kubernetes.io/name: pulsar-system-lab-provisioner
    app.kubernetes.io/part-of: pulsar-operator
    storage.pulsar.songof.dev/mode: system-directory-lab
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - persistentvolumeclaims
  - configmaps
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulsar-system-lab-provisioner
  namespace: pulsar-system-lab-storage
  labels:
    app.kubernetes.io/name: pulsar-system-lab-provisioner
    app.kubernetes.io/part-of: pulsar-operator
    storage.pulsar.songof.dev/mode: system-directory-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pulsar-system-lab-provisioner
subjects:
- kind: ServiceAccount
  name: pulsar-system-lab-provisioner
  namespace: pulsar-system-lab-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulsar-system-lab-provisioner
  labels:
    app.kubernetes.io/name: pulsar-system-lab-provisioner
    app.kubernetes.io/part-of: pulsar-operator
    storage.pulsar.songof.dev/mode: system-directory-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulsar-system-lab-provisioner
subjects:
- kind: ServiceAccount
  name: pulsar-system-lab-provisioner
  namespace: pulsar-system-lab-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar-system-lab-provisioner
  namespace: pulsar-system-lab-storage
  labels:
    app.kubernetes.io/name: pulsar-system-lab-provisioner
    app.kubernetes.io/part-of: pulsar-operator
    storage.pulsar.songof.dev/mode: system-directory-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsar-system-lab-provisioner
  template:
    metadata:
      labels:
        app: pulsar-system-lab-provisioner
        app.kubernetes.io/name: pulsar-system-lab-provisioner
        app.kubernetes.io/part-of: pulsar-operator
        storage.pulsar.songof.dev/mode: system-directory-lab
    spec:
      serviceAccountName: pulsar-system-lab-provisioner
      containers:
      - name: local-path-provisioner
        image: docker.io/rancher/local-path-provisioner:v0.0.37
        imagePullPolicy: IfNotPresent
        command:
        - local-path-provisioner
        - --debug
        - start
        - --config
        - /etc/config/config.json
        - --provisioner-name
        - pulsar.songof.dev/system-lab
        - --service-account-name
        - pulsar-system-lab-provisioner
        - --configmap-name
        - pulsar-system-lab-config
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config/
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONFIG_MOUNT_PATH
          value: /etc/config/
        - name: HEALTH_PORT
          value: '8080'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config-volume
        configMap:
          name: pulsar-system-lab-config
      nodeSelector:
        pulsar.songof.dev/two-node: 'true'
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pulsar-system-lab
  labels:
    app.kubernetes.io/name: pulsar-system-lab-provisioner
    app.kubernetes.io/part-of: pulsar-operator
    storage.pulsar.songof.dev/mode: system-directory-lab
  annotations:
    storageclass.kubernetes.io/is-default-class: 'false'
    defaultVolumeType: hostPath
    storage.pulsar.songof.dev/capacity-enforcement: none-system-filesystem-shared
provisioner: pulsar.songof.dev/system-lab
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: false
allowedTopologies:
- matchLabelExpressions:
  - key: kubernetes.io/hostname
    values:
    - k8s-control-1
    - iz6weeh0nfgmlsr99i8atmz
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: pulsar-system-lab-config
  namespace: pulsar-system-lab-storage
  labels:
    app.kubernetes.io/name: pulsar-system-lab-provisioner
    app.kubernetes.io/part-of: pulsar-operator
    storage.pulsar.songof.dev/mode: system-directory-lab
data:
  config.json: |
    {
      "nodePathMap": [
        {
          "node": "k8s-control-1",
          "paths": [
            "/var/lib/pulsar-system-lab"
          ]
        },
        {
          "node": "iz6weeh0nfgmlsr99i8atmz",
          "paths": [
            "/var/lib/pulsar-system-lab"
          ]
        }
      ]
    }
  setup: |
    #!/bin/sh
    set -eu
    case "$VOL_DIR" in
      /var/lib/pulsar-system-lab/pvc-*) ;;
      *) echo "Refusing directory outside the dedicated lab path" >&2; exit 1 ;;
    esac
    mkdir -m 0770 -p "$VOL_DIR"
    chown 10000:0 "$VOL_DIR"
    chmod 0770 "$VOL_DIR"
  teardown: |
    #!/bin/sh
    set -eu
    echo "Automatic directory deletion is disabled for this Retain lab storage" >&2
    exit 1
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: helper-pod
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: IfNotPresent
      nodeSelector:
        pulsar.songof.dev/two-node: 'true'
