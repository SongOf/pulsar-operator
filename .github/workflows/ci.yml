name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Go static checks
        run: go vet -tags="integration systemintegration" ./...
      - name: Initialize development dependencies
        run: make init ARGS=--integration
      - name: Module and shared unit tests
        run: make test-unit
      - name: Module integration tests
        run: make test-integration
      - name: System integration tests
        run: make test-system
      - name: Build Go entrypoints
        run: make build
      - name: Render unified deployment
        run: bash scripts/dev.sh render > /tmp/pulsar-operator.yaml
  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Pulsar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: modules/pulsar/Dockerfile
          push: false
          tags: pulsar-operator:ci
      - name: Build Storage image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: modules/storage/Dockerfile
          push: false
          tags: pulsar-operator-storage:ci
      - name: Build Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: modules/agent/Dockerfile
          push: false
          tags: pulsar-operator-agent:ci
