apiVersion: v1
kind: ServiceAccount
metadata:
  name: diskfleet-agent
  namespace: diskfleet-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diskfleet-agent
rules:
  - apiGroups: [storage.diskfleet.io]
    resources: [physicaldisks]
    verbs: [get, list, create]
  - apiGroups: [storage.diskfleet.io]
    resources: [physicaldisks/status, diskpools/status]
    verbs: [get, patch]
  - apiGroups: [storage.diskfleet.io]
    resources: [diskpools]
    verbs: [get, list, patch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, create]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: diskfleet-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: diskfleet-agent
subjects:
  - kind: ServiceAccount
    name: diskfleet-agent
    namespace: diskfleet-system
